# CrossScreenMono-v1 step 3, CPU part: HSA_cs and XGB_cs (+ same-plate reproduction control).
# Everything below "frozen AlgorithmSearch-v1 settings" is copied unchanged from
# configs/model_improvement/algorithm_search_v1/final_xgb_final.yaml (the 0.065402 T configuration).
protocol: CrossScreenMono-v1-cpu
protocol_document: docs/CROSS_SCREEN_MONO_V1_PROTOCOL.md
claim_scope: engineering_pilot_no_performance_ranking
hsa_cs: true
models:
- xgb_residual_d10_m1
seeds:
- 41
- 42
repeat_seed: 41
same_plate_controls:
- model: xgb_residual_d10_m1
  seed: 41
  saved_predictions: runs/model_improvement/algorithm_search_v1/xgb_final/xgb_residual_d10_m1_seed_41_primary/predictions.csv
# frozen AlgorithmSearch-v1 settings
reference_run: runs/model_improvement/comparator_gpu_v2
data_root: ../bisurfgnn
benchmark_config: configs/benchmark_bisurf_unclipped.yaml
cell_config: configs/cell_context.yaml
fold: 0
sampling_seed: 41
sampling_salt: model-comparator-gpu-v2
preserve_partner_cell_support: true
train_max_points: 18000
validation_max_points: 9000
device: cpu
threads: 2
max_wall_seconds: 10800
auxiliary_weight: 0.5
training:
  epochs: 40
  mono_epochs: 0
  batch_size: 512
  evaluation_batch_size: 256
  batch_surfaces: 128
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  min_delta: 1.0e-05
xgboost:
  learning_rate: 0.03
  max_trees: 3000
  eval_every: 50
  subsample: 0.8
  colsample: 0.8
  drug_pca: 16
  cell_pca: 16
  threads: 6
