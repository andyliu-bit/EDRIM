[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bisurfgnn"
version = "0.1.0"
description = "Symmetry-constrained graph neural fields for cold-start drug-combination dose-response surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
data = [
  "pandas>=2.1",
  "pyarrow>=15.0",
  "lxml>=5.0",
  "rdkit>=2024.3",
  "scikit-learn>=1.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
bisurfgnn = "bisurfgnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
