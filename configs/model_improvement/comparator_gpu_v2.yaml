protocol: ModelComparatorGPU-v2
protocol_document: docs/COMPARATOR_GPU_PROTOCOL.md
claim_scope: engineering_pilot_no_performance_ranking
data_root: ../bisurfgnn
benchmark_config: configs/benchmark_bisurf_unclipped.yaml
cell_config: configs/cell_context.yaml
fold: 0
seeds: [41, 42, 43, 44, 45]
sampling_seed: 41
sampling_salt: model-comparator-gpu-v2
preserve_partner_cell_support: true
train_max_points: 18000
validation_max_points: 9000
device: cuda
threads: 2
max_wall_seconds: 3600
report_prefix: model_comparator_gpu_v2
models: [ddprism_hallmark_observed_mono, bisurf_legacy, bisurf_mono_v2, combokr2_dense_minres]
training:
  epochs: 40
  mono_epochs: 40
  batch_size: 512
  evaluation_batch_size: 256
  batch_surfaces: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  min_delta: 0.00001
combokr:
  maxiter: 20
  max_training_surfaces: 5000
  nystrom_tol: 0.1
  hill_max_nfev: 1000
  braid_max_nfev: 1000
  kernel_gamma: 0.02
