  residual_monotherapy_input: true
  reference_mode: observed_hsa
  hidden_dim: 136
  attention_heads: 4
  graph_layers: 2
  dose_frequencies: 4
  dropout: 0.10
  parameter_match_target: 2031839
  max_parameter_relative_gap: 0.02
  batch_surfaces: 128
  evaluation_batch_points: 8192
  max_epochs: 200
  min_epochs: 10
  patience: 20
  min_delta: 0.00001
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  residual_shrinkage: 0.0
  seeds: [41, 42, 43]
  go_relative_improvement: 0.05
  go_required_folds: 4
