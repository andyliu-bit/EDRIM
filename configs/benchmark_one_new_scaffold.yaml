project_root: ..

nci_processed_dir: data/processed/nci_almanac
cell_processed_dir: data/processed/cellminer
output_dir: data/processed/one_new_scaffold_benchmark
runs_dir: runs/one_new_scaffold

# Primary M2 pilot protocol. The test drug may use its observed monotherapy
# curve, so this is not the fully-inductive setting.
protocol: OneNewScaffoldAnchored-v1
information_setting: observed_monotherapy_anchored

# This endpoint remains an engineering target until the endpoint comparison is
# frozen. Benchmark code must carry this status into every result artifact.
endpoint: clipped_PERCENTGROWTHNOTZ_over_100
endpoint_decision_status: provisional_engineering

folds: 5
validation_offset: 1
split_seed: 41

# Whole-molecule Morgan clustering is combined with exact identity and exact
# non-empty Bemis-Murcko scaffold constraints through connected components.
similarity_threshold: 0.70
fingerprint_radius: 2
fingerprint_bits: 2048

# Frozen M2b development baseline. The current NCI cohort is a development
# benchmark because its parameter-free test references have already been read;
# it is not an independent publication-confirmation cohort.
learned_morgan:
  reference_mode: observed_hsa
  hidden_dim: 256
  dropout: 0.10
  batch_surfaces: 128
  max_epochs: 200
  min_epochs: 10
  patience: 20
  min_delta: 0.00001
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  seeds: [41, 42, 43]
